name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      delay:
        description: Simulated deploy duration (s)
        default: '20'
        type: string
concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 5 && echo build ok
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        env:
          TARGET: ${{ inputs.environment || 'staging' }}
          DELAY: ${{ inputs.delay || '15' }}
        run: |
          echo "deploying $GITHUB_SHA to $TARGET for $DELAY s"
          sleep "$DELAY"
          if grep -q "^fail=$TARGET" deploy.flags 2>/dev/null; then echo 'deploy script failed'; exit 1; fi
